<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Research Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center">
  <div class="w-full max-w-md p-8">
    <div class="text-center mb-8">
      <div class="text-4xl mb-3">🔬</div>
      <h1 class="text-2xl font-bold text-white">AI Research Assistant</h1>
      <p class="text-slate-400 text-sm mt-1">Hematology · Precision Medicine · Wellness</p>
    </div>
    <form id="loginForm" class="space-y-4">
      <input
        id="password"
        type="password"
        placeholder="Password"
        class="w-full px-4 py-3 rounded-lg bg-slate-800 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-blue-500"
        autofocus
      />
      <button
        type="submit"
        class="w-full py-3 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-semibold transition"
      >เข้าสู่ระบบ</button>
      <p id="err" class="text-red-400 text-sm text-center hidden">Password ไม่ถูกต้อง</p>
    </form>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pw = document.getElementById('password').value;
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({password: pw}),
      });
      if (res.ok) {
        window.location.href = '/dashboard';
      } else {
        document.getElementById('err').classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
